<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兰马 · 研究台</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<aside class="sidebar">
  <a class="brand" href="/" aria-label="兰马研究台首页"><span class="brand-mark">兰</span><span>兰马<span class="brand-sub">研究台 / RESEARCH</span></span></a>
  <div class="nav-label">研究工作区</div>
  <nav aria-label="主导航">
    <button class="nav active" data-view="posts"><span>▤</span> 帖子与标注 <small>550</small></button>
    <button class="nav" data-view="queries"><span>◈</span> 检索效果</button>
    <button class="nav" data-view="media"><span>▧</span> 媒体待核验</button>
    <button class="nav" data-view="exceptions"><span>ⓘ</span> 异常与说明</button>
  </nav>
  <div class="sidebar-note"><span class="status-dot"></span> 本机数据 · 只读浏览<p>兰州马拉松交叉检索<br>候选池 · 2026.10.29</p></div>
</aside>
<main>
  <header class="topbar"><div><span class="eyebrow">LANZHOU MARATHON</span><h1 id="page-title">帖子与标注</h1></div><div class="top-actions"><span id="updated" class="muted"></span><button id="refresh" class="button">↻ 刷新数据</button></div></header>
  <section class="metrics" aria-label="候选池概况" id="metrics"></section>
  <div class="scope"><span>正文逐读已完成</span> 本面板呈现冻结候选池的单人逐读初标，图片、视频核验状态另记。候选处理进度不等于平台总体覆盖率。</div>
  <section id="posts-view" class="view">
    <div class="toolbar"><div class="quick-filters"><button class="quick active" data-quick="all">全部正文</button><button class="quick" data-quick="target">目标相关</button><button class="quick" data-quick="l2">目标 L2</button><button class="quick" data-quick="uncertain">待确认</button></div><button id="download" class="button">↓ 导出筛选结果</button></div>
    <div class="filters"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索标题、正文、证据、判断或帖子 ID" aria-label="搜索全文"></label><select id="relation" aria-label="相关性"><option value="">全部相关性</option></select><select id="level" aria-label="正文层级"><option value="">全部层级</option><option>L0</option><option>L1</option><option>L2</option><option value="未定">未定</option></select><select id="type" aria-label="帖子类型"><option value="">全部类型</option><option value="normal">图文</option><option value="video">视频</option></select><button id="reset" class="text-button">重置</button></div>
    <div class="workspace">
      <section class="list-panel"><div class="list-heading"><strong id="result-count">正在读取…</strong><span>按逐读顺序</span></div><div id="post-list" role="list" aria-label="筛选结果"></div><div class="pagination"><button id="prev-page" aria-label="上一页">←</button><span id="page-count"></span><button id="next-page" aria-label="下一页">→</button></div></section>
      <article class="detail-panel" id="detail" aria-label="原文与标注详情"><div class="empty">正在加载本机标注数据…</div></article>
    </div>
  </section>
  <section id="queries-view" class="view" hidden></section>
  <section id="media-view" class="view" hidden></section>
  <section id="exceptions-view" class="view" hidden></section>
  <div id="error" role="alert" hidden></div>
  <footer>兰马研究台 <span>来源保留 · 证据可查 · 媒体状态独立记录</span></footer>
</main>
</body></html>
